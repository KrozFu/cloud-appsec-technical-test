[project]
name = "threat-agent"
version = "0.1.0"
description = "Threat Modeling Agent - asistente de STRIDE para el Secure SDLC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Solo hace falta para los proveedores compatibles con OpenAI
# (openai, openrouter, gemini y endpoints locales): uv sync --extra openai
openai = ["openai>=1.60"]

[project.scripts]
threat-agent = "threat_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
